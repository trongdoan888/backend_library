name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo -v --redact --exit-code 0

  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan dependencies for known vulnerabilities (trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 0
          ignore-unfixed: true

  trivy-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image for scanning
        run: docker build -t backend:ci .

      - name: Scan image for known vulnerabilities (trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: backend:ci
          severity: CRITICAL,HIGH
          exit-code: 0
          ignore-unfixed: true
